name: Generate Documentation

on:
  push:
    branches:
      - '**' # Si attiva su ogni push in qualsiasi branch

jobs:
  phpdoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Calcola il nome della cartella (Logica semplificata)
      - name: Determine documentation target directory
        id: set-dir
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          if [ "$BRANCH_NAME" = "master" ] || [ "$BRANCH_NAME" = "develop" ] || [ "$BRANCH_NAME" = "release" ]; then
            # Se è uno dei tre branch principali, usa il suo nome come cartella
            TARGET_DIR="$BRANCH_NAME"
          else
            # Tutti gli altri branch finiscono in latest
            TARGET_DIR="latest"
          fi
          
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      # Step 2: Genera la documentazione con il tema moderno
      - name: Run phpDocumentor
        run: |
          TARGET_PATH="docs-build/${{ steps.set-dir.outputs.target_dir }}"
          mkdir -p $TARGET_PATH
          
          # Eseguiamo la build pulita col tema 'default' e il titolo corretto
          docker run --rm -v $(pwd):/data phpdoc/phpdoc:3 run \
            -t /data/$TARGET_PATH \
            --template="default" \
            --title="eXperience Core"

      # Step 2b: Forza l'inserimento del logo sovrascrivendo l'asset del tema
      - name: Inject Logo into Generated Documentation
        run: |
          TARGET_PATH="docs-build/${{ steps.set-dir.outputs.target_dir }}"
          
          # Il tema 'default' (responsive-twig) posiziona le immagini in 'images/' o 'css/images/'
          # Controlliamo dove phpDoc ha creato la cartella delle immagini nella build appena fatta
          echo "Verifica cartelle generate:"
          ls -R $TARGET_PATH | grep -E "images|img" || true
          
          # Copiamo il tuo logo sovrascrivendo l'icona/logo di default del template.
          # Nota: Il tema moderno spesso cerca un file chiamato 'logo.png' o svariati asset grafici.
          # Per sicurezza creiamo la cartella images se non esistesse e ci piazziamo il logo.
          mkdir -p $TARGET_PATH/images
          cp assets/logodoc.png $TARGET_PATH/images/logo.png
          
          # Molti temi usano la cartella css/images per i loghi della sidebar
          mkdir -p $TARGET_PATH/css/images
          cp assets/logodoc.png $TARGET_PATH/css/images/logo.png
          
          # Se il tema usa un logo specifico di phpDocumentor (es. logo.svg o phpdoc-logo.png),
          # lo rimpiazziamo con il tuo (convertito al volo o mantenendo l'estensione se il browser lo tollera)
          if [ -f $TARGET_PATH/images/phpdoc-logo.png ]; then
            cp assets/logodoc.png $TARGET_PATH/images/phpdoc-logo.png
          fi

      - name: Fix permissions
        run: sudo chown -R $USER:$USER docs-build/

      # Step 3: Crea l'indice HTML statico Bilingue con Logo
      - name: Create Main Index Redirect
        run: |
          # 3a. Assicurati che esista una cartella per gli asset nella build
          mkdir -p docs-build/assets
          
          # 3b. Copia il tuo logo dal repo alla cartella di build
          # Sostituisci 'assets/logodoc.png' con il percorso reale del tuo logo nel repo
          if [ -f assets/logodoc.png ]; then
            cp assets/logodoc.png docs-build/assets/logodoc.png
          else
            echo "::warning::Logo file not found at assets/logo.png, skipping copy."
          fi

          # 3c. Genera l'HTML bilingue con il logo
          cat <<EOF > docs-build/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Documentation Hub</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: 0 auto; color: #24292e; background-color: #f6f8fa; }
              .container { background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
              .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid #eaecef; padding-bottom: 20px; }
              /* Stili per il Logo */
              .logo { max-width: 376px; height: auto; margin-bottom: 15px; } 
              h1 { font-size: 1.8em; margin: 0; color: #333; }
              .grid { display: flex; gap: 40px; margin-top: 30px; }
              .col { flex: 1; min-width: 280px; }
              @media (max-width: 600px) { .grid { flex-direction: column; gap: 20px; } padding: 10px; .container { padding: 20px; } }
              h2 { font-size: 1.3em; color: #586069; border-bottom: 1px dashed #eaecef; padding-bottom: 5px; margin-top: 0; }
              p.intro { color: #555; text-align: center; margin-bottom: 30px; font-size: 1.1em; }
              ul { padding-left: 0; list-style-type: none; margin-top: 15px; }
              li { margin-bottom: 18px; display: flex; flex-direction: column; background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #e1e4e8; transition: box-shadow 0.2s; }
              li:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
              .link-container { display: flex; align-items: center; justify-content: space-between; }
              a { color: #0366d6; text-decoration: none; font-weight: 600; font-size: 1.1em; }
              a:hover { text-decoration: underline; }
              .desc { color: #6a737d; font-size: 0.9em; margin-top: 5px; display: block; }
              .badge { background-color: #e1f5fe; color: #0288d1; padding: 3px 8px; border-radius: 4px; font-size: 0.75em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
              .badge-stable { background-color: #e8f5e9; color: #2e7d32; }
              .badge-rc { background-color: #fff3e0; color: #ef6c00; }
              .badge-preview { background-color: #eceff1; color: #37474f; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="header">
                <img src="./assets/logodoc.png" alt="Project Logo" class="logo">
                <h1>Documentation Hub / Archivio Documentazione</h1>
              </div>

              <div class="grid">
                <div class="col">
                  <h2>English</h2>
                  <p>Select the version of the technical documentation you wish to consult:</p>
                  <ul>
                    <li>
                      <div class="link-container"><a href="./master/">Master Branch</a><span class="badge badge-stable">Stable</span></div>
                      <span class="desc">Production-ready documentation.</span>
                    </li>
                    <li>
                      <div class="link-container"><a href="./release/">Release Branch</a><span class="badge badge-rc">RC</span></div>
                      <span class="desc">Release Candidate currently under testing.</span>
                    </li>
                    <li>
                      <div class="link-container"><a href="./develop/">Develop Branch</a><span class="badge">Dev</span></div>
                      <span class="desc">Current state of active development.</span>
                    </li>
                    <li>
                      <div class="link-container"><a href="./latest/">Latest Preview</a><span class="badge badge-preview">Preview</span></div>
                      <span class="desc">Documentation from the most recent feature/bugfix branch.</span>
                    </li>
                  </ul>
                </div>

                <div class="col">
                  <h2>Italiano</h2>
                  <p>Seleziona la versione della documentazione tecnica da consultare:</p>
                  <ul>
                    <li>
                      <div class="link-container"><a href="./master/">Branch Master</a><span class="badge badge-stable">Stabile</span></div>
                      <span class="desc">Documentazione della versione in produzione.</span>
                    </li>
                    <li>
                      <div class="link-container"><a href="./release/">Branch Release</a><span class="badge badge-rc">RC</span></div>
                      <span class="desc">Release Candidate in fase di test e validazione.</span>
                    </li>
                    <li>
                      <div class="link-container"><a href="./develop/">Branch Develop</a><span class="badge">Sviluppo</span></div>
                      <span class="desc">Stato dell'arte dello sviluppo corrente.</span>
                  </li>
                    <li>
                      <div class="link-container"><a href="./latest/">Ultima Anteprima</a><span class="badge badge-preview">Anteprima</span></div>
                      <span class="desc">Documentazione temporanea dell'ultimo branch di feature/fix.</span>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </body>
          </html>
          EOF
      # Step 4: Deploy mantenendo lo storico degli altri branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-build
          keep_files: true