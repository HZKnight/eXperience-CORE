name: Open Pull Request Workflow
on:
  pull_request_target:
    types: [opened, ready_for_review]

jobs:
       
  # 1. TEST E QUALITÀ CON SONAR
  unit_test_and_quality:
    if: github.event.pull_request.merged == true 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Aggiornato alla v4 stabile ufficiale
      with:
        fetch-depth: 0

    # Configura l'ambiente PHP unico e nativo sulla macchina Linux
    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, pdo_sqlite, gettext # Inclusa gettext per dgettext()
        coverage: xdebug

    # Installa le dipendenze direttamente nell'ambiente configurato
    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    # Lancia PHPUnit nativo usando la tua configurazione in test/phpunit.xml
    # Nota: Rimuoviamo l'argomento bootstrap da qui perché ci pensa già il tuo xml (bootstrap="bootstrap.php")
    - name: Run PHPUnit Tests
      run: vendor/bin/phpunit --configuration test/phpunit.xml --coverage-clover test/coverage.xml

    # Avvia lo scan di SonarCloud leggendo la coverage generata
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORG }}
          -Dsonar.php.coverage.reportPaths=test/coverage.xml